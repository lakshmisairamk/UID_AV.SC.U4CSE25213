<!DOCTYPE html>
<html>
<head>
    <title>Sign of Product</title>

    <script>
        function findSign() {

            // Take input from user
            let a = parseInt(prompt("Enter first number:"));
            let b = parseInt(prompt("Enter second number:"));
            let c = parseInt(prompt("Enter third number:"));

            let negativeCount = 0;

            // Count negative numbers
            if (a < 0) negativeCount++;
            if (b < 0) negativeCount++;
            if (c < 0) negativeCount++;
// Check sign
            if (negativeCount % 2 === 0) {
                alert("The sign is plus (+)");
            } else {
                alert("The sign is minus (-)");
            }
        }
    </script>
</head>

<body>

<h3>Find Sign of Product of Three Numbers</h3>

<button onclick="findSign()">Check Sign</button>

</body>
</html>
