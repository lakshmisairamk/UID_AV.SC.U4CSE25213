<!DOCTYPE html>
<html>
<head>
    <title>Week 10 Lab</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: #333;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            color: #0077cc;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 80px;
        }

        button {
            padding: 10px 15px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }

        p {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>A. Sign of Product</h2>
    <input type="number" id="a1">
    <input type="number" id="a2">
    <input type="number" id="a3">
    <button onclick="signProduct()">Check</button>
</div>

<div class="container">
    <h2>B. Sort 3 Numbers</h2>
    <input type="number" id="b1">
    <input type="number" id="b2">
    <input type="number" id="b3">
    <button onclick="sortNumbers()">Sort</button>
</div>

<div class="container">
    <h2>C. Largest of 5 Numbers</h2>
    <input type="number" id="c1">
    <input type="number" id="c2">
    <input type="number" id="c3">
    <input type="number" id="c4">
    <input type="number" id="c5">
    <button onclick="findLargest()">Find Largest</button>
</div>

<div class="container">
    <h2>D. Odd or Even (0–15)</h2>
    <button onclick="oddEven()">Display</button>
    <p id="output"></p>
</div>

<div class="container">
    <h2>E. Student Grade</h2>
    <input type="number" id="m1" placeholder="Sub1">
    <input type="number" id="m2" placeholder="Sub2">
    <input type="number" id="m3" placeholder="Sub3">
    <input type="number" id="m4" placeholder="Sub4">
    <input type="number" id="m5" placeholder="Sub5">
    <input type="number" id="m6" placeholder="Sub6">
    <button onclick="calculateGrade()">Calculate</button>
</div>

<script>

// A. Sign of Product
function signProduct() {
    let a = Number(a1.value);
    let b = Number(a2.value);
    let c = Number(a3.value);

    let negatives = 0;

    if (a < 0) negatives++;
    if (b < 0) negatives++;
    if (c < 0) negatives++;

    if (a === 0 || b === 0 || c === 0) {
        alert("Sign is 0");
    } else if (negatives % 2 === 0) {
        alert("Sign is + (Positive)");
    } else {
        alert("Sign is - (Negative)");
    }
}

// B. Sort 3 Numbers
function sortNumbers() {
    let x = Number(b1.value);
    let y = Number(b2.value);
    let z = Number(b3.value);

    let arr = [x, y, z];
    arr.sort(function(a, b){ return a - b });

    alert("Sorted Order: " + arr);
}

// C. Largest of 5 Numbers
function findLargest() {
    let nums = [
        Number(c1.value),
        Number(c2.value),
        Number(c3.value),
        Number(c4.value),
        Number(c5.value)
    ];

    let max = nums[0];

    for (let i = 1; i < nums.length; i++) {
        if (nums[i] > max) {
            max = nums[i];
        }
    }

    alert("Largest number is: " + max);
}

// D. Odd or Even
function oddEven() {
    let result = "";

    for (let i = 0; i <= 15; i++) {
        if (i % 2 === 0) {
            result += i + " is Even<br>";
        } else {
            result += i + " is Odd<br>";
        }
    }

    document.getElementById("output").innerHTML = result;
}

// E. Grade Calculation
function calculateGrade() {
    let marks = [
        Number(m1.value),
        Number(m2.value),
        Number(m3.value),
        Number(m4.value),
        Number(m5.value),
        Number(m6.value)
    ];

    let sum = 0;
    for (let i = 0; i < marks.length; i++) {
        sum += marks[i];
    }

    let avg = sum / 6;
    let grade;

    if (avg >= 90) grade = "A";
    else if (avg >= 75) grade = "B";
    else if (avg >= 60) grade = "C";
    else if (avg >= 50) grade = "D";
    else grade = "F";

    alert("Average: " + avg + " Grade: " + grade);
}

</script>

</body>
</html>
